name: Dependency Submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    name: Submit Gradle runtime graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 只提交 app 的编译 / 运行时配置，不把 buildscript、Kotlin 工具链等
      # 开发期 classpath 里的旧传递依赖算进 GitHub 依赖图。
      DEPENDENCY_GRAPH_INCLUDE_PROJECTS: ':app'
      DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: '.*(RuntimeClasspath|CompileClasspath)'
      DEPENDENCY_GRAPH_RUNTIME_INCLUDE_CONFIGURATIONS: '.*RuntimeClasspath'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0"

      - uses: gradle/actions/dependency-submission@v6
