name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -Pca.withGdt=false --no-daemon --console=plain
