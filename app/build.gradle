apply plugin: 'com.android.application'

// 脚本（assets/script.js）是用「签名证书 DER 逐字节异或 + GZIP」加密的，
// 所以签名用的密钥必须和 CA 侧 app/signatures/*.signature 里的证书一致。
// 这里统一用 app/signatures/release.keystore（alias: testkey）：
//   debug 包  -> 由 Gradle 用它签名，配合 signatures/debug.signature
//   release 包 -> 保持未签名（app-release-unsigned.apk），由 CA 的
//                 cabuild shellBuildRelease（zipalign + apksigner）用它签名
def caKeystore = file('signatures/release.keystore')
def caPasswordFile = file('signatures/release.password')

// 账号/密钥类值（TalkingData token、优量汇 AppID/广告位、Gitee OAuth、反馈 token）
// 一律从 local.properties 读取，仓库里的 Secret.java 直接取 BuildConfig，
// 默认留空 → 对应功能自动关闭。键名见 README「本地依赖与本机密钥」。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def secretValue = { String name ->
    '"' + ((localProps.getProperty(name) ?: '').replace('\\', '\\\\').replace('"', '\\"')) + '"'
}

android {
    namespace 'com.xero.ca'
    compileSdk 33

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility 17
        targetCompatibility 17
    }

    signingConfigs {
        if (caKeystore.exists() && caPasswordFile.exists()) {
            ca {
                storeFile caKeystore
                storePassword caPasswordFile.text.trim()
                keyAlias 'testkey'
                keyPassword caPasswordFile.text.trim()
            }
        }
    }

    defaultConfig {
        applicationId "com.xero.ca"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 20741
        versionName "1.2.14"
        buildConfigField "int", "SHELL_VERSION", "26"
        // 下列值来自 local.properties（缺省为空，功能自动关闭），Secret.java 直接读取
        buildConfigField "String", "SECRET_TD_TOKEN", secretValue('ca.tdToken')
        buildConfigField "String", "SECRET_GDT_APP_ID", secretValue('ca.gdtAppId')
        buildConfigField "String", "SECRET_GDT_POS_ID", secretValue('ca.gdtPosId')
        buildConfigField "String", "SECRET_GITEE_CLIENT_ID", secretValue('ca.giteeClientId')
        buildConfigField "String", "SECRET_GITEE_CLIENT_SECRET", secretValue('ca.giteeClientSecret')
        buildConfigField "String", "SECRET_GITEE_FEEDBACK_TOKEN", secretValue('ca.giteeFeedbackToken')
        multiDexEnabled true
    }
    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            multiDexEnabled true
            // 没有 signatures/ 时退回 Android 默认调试签名（此时需自行重新生成 debug.signature）
            signingConfig signingConfigs.findByName('ca') ?: signingConfigs.debug
            jniDebuggable true
        }
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            jniDebuggable false
            multiDexEnabled true
        }
    }
    buildToolsVersion '34.0.0'
    sourceSets {
        main {
            // 本地没有 TalkingData jar 时，用 app/src/stub/java 里的空实现编译，
            // 保证 clone 下来没有任何本地依赖也能直接构建（统计功能等于关闭）
            if (!file('libs/SaaS_TalkingDataSDK_Android_V5.0.38.jar').exists()) {
                java.srcDir 'src/stub/java'
            }
        }
    }
    buildFeatures {
        viewBinding false
        buildConfig true
    }
    dependenciesInfo {
        includeInApk true
        includeInBundle true
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'

    if (file('libs/SaaS_TalkingDataSDK_Android_V5.0.38.jar').exists()) {
        implementation files('libs/SaaS_TalkingDataSDK_Android_V5.0.38.jar')
    }
    // 上面的 jar 缺失时，改用 app/src/stub/java 里的空实现（见 sourceSets）
    // 本地依赖不入库（见 app/libs/.gitignore），缺失时跳过，转化SDK 不参与也不影响广告
    if (file('libs/GDTActionSDK.min.1.9.8.aar').exists()) {
        implementation files('libs/GDTActionSDK.min.1.9.8.aar')
    }

    implementation 'com.qq.e.union:union:4.710.1580'
    implementation 'com.android.support:support-annotations:28.0.0'
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'org.mozilla:rhino-runtime:1.7.15.1'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'com.jakewharton.android.repackaged:dalvik-dx:16.0.1'
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'
}
