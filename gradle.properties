# Gradle 构建配置（Gradle 与 Android Studio 都会读取本文件）
#
# 这里只放「与机器无关」的设置；本机专属的东西请放 ~/.gradle/gradle.properties，例如：
#   org.gradle.java.home=/path/to/jdk      （指定构建用 JDK）
#   systemProp.http.proxyHost=...          （代理）
# 这样换台机器 clone 下来不会因为路径不存在而构建失败。

# 守护进程 JVM：AGP 8 + R8 精简（工程里含优量汇等较大 SDK）比较吃内存；
# 固定 UTF-8 可避免在 GBK 环境下源码/中文资源被 javac 按错误编码读取。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 以下两项只影响构建速度，不影响产物内容：
# 并行执行任务
org.gradle.parallel=true
# 复用本地构建缓存（~/.gradle/caches/build-cache-1）
org.gradle.caching=true
