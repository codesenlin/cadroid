[versions]
# 构建插件
agp = "9.5.1"
kotlin = "2.4.21"

# 运行时依赖
desugar-jdk-libs = "2.1.5"
androidx-annotation = "1.11.0"
# 1.19.x 要求 minSdk 23；App 仍保持 minSdk 21，暂留 1.17.0
androidx-core-ktx = "1.17.0"
dalvik-dx = "16.0.1"
zip4j = "2.11.6"
java-websocket = "1.6.0"
rhino = "1.9.2"
quickjs = "1.0.18"
gdt-union = "4.712.1582"

# buildscript 的 CVE 修补依赖
guava = "33.8.0-jre"
commons-lang3 = "3.21.0"
jose4j = "0.9.7"
bouncycastle = "1.86"
jdom2 = "2.0.6.1"

[libraries]
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
dalvik-dx = { module = "com.jakewharton.android.repackaged:dalvik-dx", version.ref = "dalvik-dx" }
zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "zip4j" }
java-websocket = { module = "org.java-websocket:Java-WebSocket", version.ref = "java-websocket" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
rhino-engine = { module = "org.mozilla:rhino-engine", version.ref = "rhino" }
rhino-kotlin = { module = "org.mozilla:rhino-kotlin", version.ref = "rhino" }
rhino-xml = { module = "org.mozilla:rhino-xml", version.ref = "rhino" }
quickjs-kt-android = { module = "io.github.dokar3:quickjs-kt-android", version.ref = "quickjs" }
gdt-union = { module = "com.qq.e.union:union", version.ref = "gdt-union" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "jose4j" }
bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
jdom2 = { module = "org.jdom:jdom2", version.ref = "jdom2" }
